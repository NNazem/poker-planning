<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Card body -->
  <rect x="2" y="2" width="196" height="276" rx="12" fill="#2a2a3e" stroke="#c9a84c" stroke-width="3"/>
  <!-- Inner background -->
  <rect x="10" y="10" width="180" height="260" rx="8" fill="#1e1e32"/>
  <!-- Diamond crosshatch pattern -->
  <defs>
    <pattern id="diamonds" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0L24 12L12 24L0 12Z" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="180" height="260" rx="8" fill="url(#diamonds)"/>
  <!-- Top left J -->
  <text x="24" y="42" font-family="Georgia,serif" font-weight="bold" font-size="32" fill="#e8d5a3">J</text>
  <!-- Center joker face -->
  <g transform="translate(100,140)">
    <!-- Hat -->
    <path d="M-25,-45 L0,-65 L25,-45 L15,-40 L0,-55 L-15,-40 Z" fill="#c9a84c" opacity="0.8"/>
    <circle cx="-25" cy="-45" r="5" fill="#c9a84c"/>
    <circle cx="0" cy="-65" r="5" fill="#c9a84c"/>
    <circle cx="25" cy="-45" r="5" fill="#c9a84c"/>
    <!-- Face -->
    <circle cx="0" cy="-15" r="28" fill="#f5e6c8" stroke="#333" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-22" r="4" fill="#333"/>
    <circle cx="10" cy="-22" r="4" fill="#333"/>
    <!-- Smile -->
    <path d="M-12,-8 Q0,5 12,-8" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nose -->
    <circle cx="0" cy="-14" r="3" fill="#e74c3c"/>
    <!-- Collar -->
    <path d="M-20,12 L0,25 L20,12 L10,15 L0,20 L-10,15 Z" fill="#c9a84c" opacity="0.7"/>
  </g>
  <!-- Bottom right J (rotated) -->
  <text x="176" y="258" font-family="Georgia,serif" font-weight="bold" font-size="32" fill="#e8d5a3" text-anchor="end" transform="rotate(180,176,244)">J</text>
</svg>
